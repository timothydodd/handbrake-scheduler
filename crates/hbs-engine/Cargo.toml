[package]
name = "hbs-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "HandbrakeScheduler engine: HandBrakeCLI processes, folder scanning, the upload server, the job queue"

[dependencies]
hbs-core = { path = "../hbs-core" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { version = "0.7" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "multipart", "tokio"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_JobObjects",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
