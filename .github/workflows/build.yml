name: Build

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend type check
        run: npx tsc --noEmit

      - name: Test
        run: cargo test -p hbs-core -p hbs-engine

      # Builds the frontend (beforeBuildCommand), the exe and the NSIS/MSI installers.
      - name: Build
        run: npx tauri build

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: handbrake-scheduler-windows
          path: |
            target/release/handbrake-scheduler.exe
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error
