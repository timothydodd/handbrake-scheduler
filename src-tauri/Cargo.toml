[package]
name = "handbrake-scheduler"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Watch folders and encode videos with HandBrakeCLI on a schedule"

[lib]
# The `_lib` suffix avoids a name collision with the binary on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "hbs_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hbs-core = { path = "../crates/hbs-core" }
hbs-engine = { path = "../crates/hbs-engine" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
