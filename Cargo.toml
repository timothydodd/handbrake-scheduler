[workspace]
resolver = "2"
members = [
  "crates/hbs-core",
  "crates/hbs-engine",
  "src-tauri",
]

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/timothydodd/handbrake-scheduler"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "process", "fs", "net"] }
